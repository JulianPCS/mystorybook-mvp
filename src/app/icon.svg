<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#14b8a6"/>
  <!-- Pencil body -->
  <rect x="5" y="13" width="16" height="6" rx="1.5" fill="white"/>
  <!-- Eraser -->
  <rect x="3" y="14" width="4" height="4" rx="1" fill="#f59e0b"/>
  <!-- Tip -->
  <polygon points="21,13 27,16 21,19" fill="#0d9488"/>
  <!-- Star -->
  <circle cx="28" cy="16" r="3" fill="#f59e0b"/>
  <text x="28" y="18.5" font-size="4.5" text-anchor="middle" fill="white" font-weight="bold">✦</text>
</svg>
